<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Stackly Travel & Tourism</title>
  <meta name="description" content="Manage your wilderness expeditions, guide schedules, agency partner bookings, and system metrics.">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Full Viewport Site Loader -->
  <div id="siteLoader" class="site-loader" aria-live="polite">
    <div class="loader-content">
      <div class="loader-logo-wrap">
        <img src="assets/images/logoStackly.webp" alt="Stackly Travel">
      </div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading Portal Session...</div>
    </div>
  </div>

  <div class="dash-wrapper">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="dash-sidebar-brand">
        <!-- Logo click strictly redirects to index.html -->
        <a href="index.html" title="Return to Stackly Home">
          <img src="assets/images/logoStackly.webp" alt="Stackly Logo">
        </a>
      </div>

      <nav class="dash-nav" aria-label="Dashboard Navigation">
        <div class="dash-nav-header">Main Menu</div>
        <a href="dashboard-traveler.html" class="dash-nav-item active">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Overview</span>
        </a>
        <a href="dashboard-expeditions.html" class="dash-nav-item">
          <i class="fa-solid fa-compass"></i>
          <span>Expeditions</span>
        </a>
        <a href="dashboard-itineraries.html" class="dash-nav-item">
          <i class="fa-solid fa-calendar-days"></i>
          <span>Itineraries</span>
        </a>
        <a href="dashboard-safety.html" class="dash-nav-item">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Safety & Permits</span>
        </a>

        <div class="dash-nav-header" style="margin-top:14px;">Preferences</div>
        <a href="dashboard-settings.html" class="dash-nav-item">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
        <a href="dashboard-support.html" class="dash-nav-item">
          <i class="fa-solid fa-headset"></i>
          <span>24/7 Field Support</span>
        </a>
      </nav>

      <!-- Sidebar User Footer with Sign Out -->
      <div class="dash-user-footer">
        <div class="dash-user-info">
          <div class="dash-user-avatar dash-user-initials">ST</div>
          <div class="dash-user-text">
            <div class="dash-user-name dash-user-display-name">Explorer</div>
            <div class="dash-user-role-label dash-user-display-role">Traveler</div>
          </div>
        </div>
        <button type="button" id="dashSignOutBtn" title="Sign Out" style="background:none; border:none; color:#EF4444; cursor:pointer; font-size:1.15rem; padding:4px;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="dash-main">
      <header class="dash-topbar">
        <div class="dash-greeting-box">
          <h2 id="dashGreetingHeading">Welcome, Explorer!</h2>
          <p id="dashLoginTimestamp">Active Session: Verified & Secured</p>
        </div>

        <div class="dash-top-actions">
          <span class="dash-role-badge dash-user-display-role">Traveler</span>
          <a href="404.html" class="dash-action-btn" title="Notifications" style="width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:#FFFFFF; display:flex; align-items:center; justify-content:center; color:var(--dark);">
            <i class="fa-regular fa-bell"></i>
          </a>
        </div>
      </header>

      <div class="dash-content">
        <div id="dashRoleContainer">
          <!-- Populated or redirected by dashboard.js based on role -->
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
